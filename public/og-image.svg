<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo degradado azul -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03"/>
    </linearGradient>
  </defs>

  <!-- Fondo principal -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Patrón de puntos sutil -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Tarjeta central -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Logo H -->
  <rect x="120" y="130" width="22" height="64" rx="5" fill="white" opacity="0.95"/>
  <rect x="158" y="151" width="22" height="22" rx="4" fill="white" opacity="0.95"/>
  <rect x="196" y="130" width="22" height="64" rx="5" fill="white" opacity="0.95"/>
  <!-- Punto dorado -->
  <circle cx="226" cy="124" r="10" fill="#fbbf24"/>

  <!-- Nombre del producto -->
  <text x="260" y="180" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="white" opacity="0.95">HaciendaKit</text>

  <!-- Separador -->
  <rect x="120" y="220" width="960" height="2" rx="1" fill="white" opacity="0.12"/>

  <!-- Tagline -->
  <text x="120" y="278" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.80">Herramientas tributarias para Costa Rica</text>

  <!-- Chips de funcionalidades -->
  <!-- Chip 1 -->
  <rect x="120" y="318" width="188" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="214" y="346" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Visor XML</text>

  <!-- Chip 2 -->
  <rect x="324" y="318" width="198" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="423" y="346" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Búsqueda CABYS</text>

  <!-- Chip 3 -->
  <rect x="538" y="318" width="230" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="653" y="346" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Validación de IVA</text>

  <!-- Chip 4 -->
  <rect x="784" y="318" width="230" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="899" y="346" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Contribuyentes</text>

  <!-- Chip 5 -->
  <rect x="120" y="378" width="218" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="229" y="406" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Tipo de Cambio</text>

  <!-- Chip 6 -->
  <rect x="354" y="378" width="198" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="453" y="406" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Calculadora IVA</text>

  <!-- Chip 7 -->
  <rect x="568" y="378" width="198" height="44" rx="22" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="667" y="406" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="white" opacity="0.90" text-anchor="middle">Exoneraciones</text>

  <!-- Separador -->
  <rect x="120" y="452" width="960" height="1" rx="0.5" fill="white" opacity="0.10"/>

  <!-- URL de producción -->
  <text x="120" y="498" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.50">hacienda-toolkit.vercel.app</text>

  <!-- Badge "Gratis · Sin registro" -->
  <rect x="820" y="473" width="260" height="40" rx="20" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <text x="950" y="499" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle">Gratis · Sin registro</text>
</svg>
